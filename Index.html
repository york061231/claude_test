<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出張経費申請システム</title>
  <style>
    /* ===== リセット & ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #4f46e5;
      --primary-dark: #3730a3;
      --primary-light:#818cf8;
      --accent:       #f59e0b;
      --success:      #10b981;
      --danger:       #ef4444;
      --bg:           #f1f5f9;
      --surface:      #ffffff;
      --text:         #1e293b;
      --text-sub:     #64748b;
      --border:       #e2e8f0;
      --radius:       12px;
      --shadow:       0 4px 24px rgba(79,70,229,.08);
      --shadow-hover: 0 8px 32px rgba(79,70,229,.18);

      /* 地区カラー */
      --district-a: #6366f1;
      --district-b: #0ea5e9;
      --district-c: #10b981;
      --district-d: #f59e0b;
      --district-e: #ec4899;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== ナビゲーション ===== */
    .navbar {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--primary-light) 100%);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(79,70,229,.3);
    }
    .navbar-brand {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: .04em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .navbar-brand .icon { font-size: 1.5rem; }
    .navbar-nav {
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      background: rgba(255,255,255,.15);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,.3);
      border-radius: 8px;
      padding: 8px 20px;
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .02em;
    }
    .nav-btn:hover { background: rgba(255,255,255,.28); transform: translateY(-1px); }
    .nav-btn.active {
      background: #fff;
      color: var(--primary);
      border-color: #fff;
    }

    /* ===== ページコンテナ ===== */
    .page { display: none; }
    .page.active { display: block; }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    /* ===== ページヘッダー ===== */
    .page-header {
      margin-bottom: 28px;
    }
    .page-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.01em;
    }
    .page-header p {
      color: var(--text-sub);
      margin-top: 4px;
      font-size: .95rem;
    }

    /* ===== 申請フォーム ===== */
    .form-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 40px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 28px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: .82rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    label .required {
      color: var(--danger);
      margin-left: 4px;
    }

    input[type="text"],
    input[type="date"],
    input[type="number"],
    select {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .97rem;
      color: var(--text);
      background: var(--surface);
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.15);
    }
    input[type="number"] { font-variant-numeric: tabular-nums; }

    .cost-input-wrap {
      position: relative;
    }
    .cost-input-wrap span {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-weight: 600;
    }
    .cost-input-wrap input { padding-left: 30px; }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    /* ===== ボタン ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .2s;
      letter-spacing: .02em;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 2px 8px rgba(79,70,229,.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(79,70,229,.4); }
    .btn-secondary {
      background: var(--bg);
      color: var(--text-sub);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 2px 8px rgba(239,68,68,.3);
    }
    .btn-danger:hover { background: #dc2626; transform: translateY(-1px); }
    .btn-icon { padding: 8px; border-radius: 8px; font-size: 1rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

    /* ===== 一覧ページ ===== */
    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .list-stats {
      font-size: .9rem;
      color: var(--text-sub);
      font-weight: 600;
    }
    .list-stats span {
      color: var(--primary);
      font-size: 1.1rem;
      font-weight: 800;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }

    /* ===== カード ===== */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
      cursor: default;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

    .card-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }
    .district-a .card-header { background: linear-gradient(135deg, #6366f1, #818cf8); }
    .district-b .card-header { background: linear-gradient(135deg, #0ea5e9, #38bdf8); }
    .district-c .card-header { background: linear-gradient(135deg, #10b981, #34d399); }
    .district-d .card-header { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .district-e .card-header { background: linear-gradient(135deg, #ec4899, #f472b6); }
    .district-  .card-header { background: linear-gradient(135deg, #94a3b8, #cbd5e1); }

    .card-district-badge {
      font-size: .78rem;
      font-weight: 800;
      background: rgba(255,255,255,.25);
      border-radius: 6px;
      padding: 3px 10px;
      letter-spacing: .08em;
    }
    .card-date {
      font-size: .82rem;
      font-weight: 600;
      opacity: .9;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-body { padding: 18px 18px 14px; }

    .card-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 3px;
    }
    .card-role {
      font-size: .84rem;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .card-destination {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .9rem;
      color: var(--text);
      font-weight: 600;
      background: var(--bg);
      border-radius: 8px;
      padding: 7px 12px;
      margin-bottom: 12px;
    }

    .card-costs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .cost-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .cost-label {
      font-size: .72rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 2px;
    }
    .cost-value {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .cost-total {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
    }
    .cost-total .cost-label { color: rgba(255,255,255,.8); }
    .cost-total .cost-value { color: #fff; font-size: 1.1rem; }

    .card-email {
      font-size: .76rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .card-actions .btn { flex: 1; justify-content: center; font-size: .88rem; padding: 8px 12px; }
    .btn-edit {
      background: var(--bg);
      color: var(--primary);
      border: 1.5px solid var(--primary-light);
      font-weight: 700;
    }
    .btn-edit:hover { background: rgba(79,70,229,.08); }
    .btn-del {
      background: var(--bg);
      color: var(--danger);
      border: 1.5px solid #fca5a5;
      font-weight: 700;
    }
    .btn-del:hover { background: rgba(239,68,68,.08); }

    /* ===== 空状態 ===== */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-sub);
    }
    .empty-state .empty-icon { font-size: 4rem; margin-bottom: 16px; opacity: .4; }
    .empty-state h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .empty-state p { font-size: .9rem; }

    /* ===== モーダル ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(15,23,42,.3);
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      padding: 24px 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 1.2rem; font-weight: 800; }
    .modal-close {
      background: var(--bg);
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--text-sub);
      transition: background .2s;
    }
    .modal-close:hover { background: var(--border); }
    .modal-body { padding: 20px 28px 28px; }
    .modal-body .form-grid { gap: 16px 24px; }

    /* ===== トースト通知 ===== */
    .toast-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: var(--text);
      color: #fff;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: .93rem;
      font-weight: 600;
      box-shadow: 0 4px 24px rgba(0,0,0,.25);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn .3s ease;
      pointer-events: auto;
    }
    .toast.success { background: var(--success); }
    .toast.error   { background: var(--danger); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(16px); }
    }

    /* ===== ローディング ===== */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.7);
      backdrop-filter: blur(2px);
      z-index: 400;
      align-items: center;
      justify-content: center;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 削除確認ダイアログ ===== */
    .confirm-modal {
      max-width: 420px;
    }
    .confirm-body { padding: 24px 28px 28px; text-align: center; }
    .confirm-icon { font-size: 3rem; margin-bottom: 12px; }
    .confirm-body h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; }
    .confirm-body p { font-size: .9rem; color: var(--text-sub); margin-bottom: 24px; }
    .confirm-actions { display: flex; gap: 12px; justify-content: center; }

    /* ===== レスポンシブ ===== */
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .form-card { padding: 24px 18px; }
      .modal-body { padding: 16px 18px 22px; }
      .modal-header { padding: 20px 18px 0; }
      .cards-grid { grid-template-columns: 1fr; }
      .navbar-brand .icon { display: none; }
    }
  </style>
</head>
<body>

<!-- ===== ナビゲーション ===== -->
<nav class="navbar">
  <div class="navbar-brand">
    <span class="icon">✈️</span>
    出張経費申請システム
  </div>
  <div class="navbar-nav">
    <button class="nav-btn active" id="navForm" onclick="showPage('form')">📝 申請する</button>
    <button class="nav-btn"        id="navList" onclick="showPage('list')">📋 一覧を見る</button>
  </div>
</nav>

<!-- ===== 申請ページ ===== -->
<div class="page active" id="pageForm">
  <div class="container">
    <div class="page-header">
      <h2>出張経費申請</h2>
      <p>必要事項を入力して申請を送信してください。</p>
    </div>
    <div class="form-card">
      <form id="expenseForm">
        <div class="form-grid">
          <div class="form-group">
            <label>名前<span class="required">*</span></label>
            <input type="text" id="name" placeholder="山田 太郎" required>
          </div>
          <div class="form-group">
            <label>部署<span class="required">*</span></label>
            <input type="text" id="department" placeholder="営業部" required>
          </div>
          <div class="form-group">
            <label>役職</label>
            <input type="text" id="position" placeholder="課長">
          </div>
          <div class="form-group">
            <label>出張先<span class="required">*</span></label>
            <input type="text" id="destination" placeholder="東京都千代田区" required>
          </div>
          <div class="form-group">
            <label>日付<span class="required">*</span></label>
            <input type="date" id="tripDate" required>
          </div>
          <div class="form-group">
            <label>地区<span class="required">*</span></label>
            <select id="district" required>
              <option value="">-- 選択してください --</option>
              <option value="A">地区 A</option>
              <option value="B">地区 B</option>
              <option value="C">地区 C</option>
              <option value="D">地区 D</option>
              <option value="E">地区 E</option>
            </select>
          </div>
          <div class="form-group">
            <label>公共交通費</label>
            <div class="cost-input-wrap">
              <span>¥</span>
              <input type="number" id="transportCost" placeholder="0" min="0">
            </div>
          </div>
          <div class="form-group">
            <label>その他費用</label>
            <div class="cost-input-wrap">
              <span>¥</span>
              <input type="number" id="otherCost" placeholder="0" min="0">
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="resetForm()">リセット</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">
            ✈️ 申請する
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ===== 一覧ページ ===== -->
<div class="page" id="pageList">
  <div class="container">
    <div class="page-header">
      <h2>申請一覧</h2>
      <p>登録されている出張経費申請の一覧です。</p>
    </div>
    <div class="list-toolbar">
      <div class="list-stats">件数: <span id="listCount">0</span> 件</div>
      <button class="btn btn-primary" onclick="loadList()">🔄 更新</button>
    </div>
    <div id="cardsContainer" class="cards-grid"></div>
  </div>
</div>

<!-- ===== 編集モーダル ===== -->
<div class="modal-overlay" id="editOverlay" onclick="closeEditModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h3>✏️ 申請内容を編集</h3>
      <button class="modal-close" onclick="closeEditModal(null)">✕</button>
    </div>
    <div class="modal-body">
      <form id="editForm">
        <input type="hidden" id="editRowIndex">
        <input type="hidden" id="editEmail">
        <div class="form-grid">
          <div class="form-group">
            <label>名前<span class="required">*</span></label>
            <input type="text" id="editName" required>
          </div>
          <div class="form-group">
            <label>部署<span class="required">*</span></label>
            <input type="text" id="editDepartment" required>
          </div>
          <div class="form-group">
            <label>役職</label>
            <input type="text" id="editPosition">
          </div>
          <div class="form-group">
            <label>出張先<span class="required">*</span></label>
            <input type="text" id="editDestination" required>
          </div>
          <div class="form-group">
            <label>日付<span class="required">*</span></label>
            <input type="date" id="editTripDate" required>
          </div>
          <div class="form-group">
            <label>地区<span class="required">*</span></label>
            <select id="editDistrict" required>
              <option value="">-- 選択 --</option>
              <option value="A">地区 A</option>
              <option value="B">地区 B</option>
              <option value="C">地区 C</option>
              <option value="D">地区 D</option>
              <option value="E">地区 E</option>
            </select>
          </div>
          <div class="form-group">
            <label>公共交通費</label>
            <div class="cost-input-wrap">
              <span>¥</span>
              <input type="number" id="editTransportCost" min="0">
            </div>
          </div>
          <div class="form-group">
            <label>その他費用</label>
            <div class="cost-input-wrap">
              <span>¥</span>
              <input type="number" id="editOtherCost" min="0">
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal(null)">キャンセル</button>
          <button type="submit" class="btn btn-primary">💾 保存する</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ===== 削除確認モーダル ===== -->
<div class="modal-overlay" id="deleteOverlay">
  <div class="modal confirm-modal">
    <div class="confirm-body">
      <div class="confirm-icon">🗑️</div>
      <h3>この申請を削除しますか？</h3>
      <p>削除すると元に戻すことはできません。</p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">キャンセル</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">削除する</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== ローディング ===== -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
</div>

<!-- ===== トースト ===== -->
<div class="toast-container" id="toastContainer"></div>

<script>
  // ===== 日付ユーティリティ =====

  /**
   * date input の値 (yyyy-mm-dd) → yyyymmdd 文字列
   */
  function dateInputToString(val) {
    if (!val) return '';
    return val.replace(/-/g, '');
  }

  /**
   * yyyymmdd 文字列 → date input の値 (yyyy-mm-dd)
   */
  function stringToDateInput(s) {
    s = String(s).trim();
    if (s.length !== 8) return '';
    return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8);
  }

  /**
   * yyyymmdd 文字列 → 表示用「yyyy年mm月dd日」
   */
  function stringToDisplayDate(s) {
    s = String(s).trim();
    if (s.length !== 8) return s;
    return s.slice(0, 4) + '年' + s.slice(4, 6) + '月' + s.slice(6, 8) + '日';
  }

  // ===== ページ切り替え =====
  function showPage(page) {
    document.querySelectorAll('.page').forEach(function(el) { el.classList.remove('active'); });
    document.querySelectorAll('.nav-btn').forEach(function(el) { el.classList.remove('active'); });
    document.getElementById(page === 'form' ? 'pageForm' : 'pageList').classList.add('active');
    document.getElementById(page === 'form' ? 'navForm' : 'navList').classList.add('active');
    if (page === 'list') loadList();
  }

  // ===== ローディング =====
  function showLoading()  { document.getElementById('loadingOverlay').classList.add('show'); }
  function hideLoading()  { document.getElementById('loadingOverlay').classList.remove('show'); }

  // ===== トースト =====
  function showToast(msg, type) {
    type = type || 'success';
    var icons = { success: '✅', error: '❌', info: 'ℹ️' };
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = (icons[type] || '') + ' ' + msg;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(function() {
      el.style.animation = 'toastOut .3s ease forwards';
      setTimeout(function() { el.remove(); }, 300);
    }, 3000);
  }

  // ===== 数値フォーマット =====
  function fmtCurrency(v) {
    return '¥' + Number(v || 0).toLocaleString('ja-JP');
  }

  // ===== 地区クラス =====
  function districtClass(d) {
    return 'district-' + (d || '').toUpperCase();
  }

  // ===== フォームリセット =====
  function resetForm() {
    document.getElementById('expenseForm').reset();
  }

  // ===== 申請フォーム送信 =====
  document.getElementById('expenseForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var dateVal = document.getElementById('tripDate').value;
    var dateStr = dateInputToString(dateVal);
    if (dateStr.length !== 8) {
      showToast('日付を正しく入力してください。', 'error');
      return;
    }
    var formData = {
      name:          document.getElementById('name').value.trim(),
      department:    document.getElementById('department').value.trim(),
      position:      document.getElementById('position').value.trim(),
      destination:   document.getElementById('destination').value.trim(),
      date:          dateStr,
      district:      document.getElementById('district').value,
      transportCost: Number(document.getElementById('transportCost').value) || 0,
      otherCost:     Number(document.getElementById('otherCost').value)     || 0
    };
    showLoading();
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        if (result && result.success) {
          showToast('申請が完了しました！', 'success');
          resetForm();
        } else {
          showToast('エラーが発生しました: ' + (result && result.error ? result.error : '不明'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('通信エラー: ' + err.message, 'error');
      })
      .saveData(formData);
  });

  // ===== 一覧読み込み =====
  function loadList() {
    showLoading();
    google.script.run
      .withSuccessHandler(function(data) {
        hideLoading();
        if (data && data.error) {
          showToast('データ取得エラー: ' + data.error, 'error');
          return;
        }
        renderCards(data || []);
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('通信エラー: ' + err.message, 'error');
      })
      .getData();
  }

  // ===== カード描画 =====
  function renderCards(dataList) {
    var container = document.getElementById('cardsContainer');
    document.getElementById('listCount').textContent = dataList.length;
    if (!dataList.length) {
      container.innerHTML =
        '<div class="empty-state" style="grid-column:1/-1">' +
          '<div class="empty-icon">📭</div>' +
          '<h3>申請データがありません</h3>' +
          '<p>申請ページから出張経費を申請してください。</p>' +
        '</div>';
      return;
    }

    container.innerHTML = dataList.map(function(item) {
      var total = (Number(item.transportCost) || 0) + (Number(item.otherCost) || 0);
      var dc = districtClass(item.district);
      var dateDisp = stringToDisplayDate(item.date);
      var emailTrimmed = item.email ? item.email : '—';
      return (
        '<div class="card ' + dc + '" data-row="' + item.rowIndex + '">' +
          '<div class="card-header">' +
            '<span class="card-district-badge">地区 ' + (item.district || '?') + '</span>' +
            '<span class="card-date">📅 ' + dateDisp + '</span>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-name">' + escHtml(item.name) + '</div>' +
            '<div class="card-role">' + escHtml(item.department) + ' / ' + escHtml(item.position || '—') + '</div>' +
            '<div class="card-destination">📍 ' + escHtml(item.destination) + '</div>' +
            '<div class="card-costs">' +
              '<div class="cost-item">' +
                '<div class="cost-label">公共交通費</div>' +
                '<div class="cost-value">' + fmtCurrency(item.transportCost) + '</div>' +
              '</div>' +
              '<div class="cost-item">' +
                '<div class="cost-label">その他費用</div>' +
                '<div class="cost-value">' + fmtCurrency(item.otherCost) + '</div>' +
              '</div>' +
              '<div class="cost-item cost-total">' +
                '<div class="cost-label">合計金額</div>' +
                '<div class="cost-value">' + fmtCurrency(total) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="card-email">📧 ' + escHtml(emailTrimmed) + '</div>' +
            '<div class="card-actions">' +
              '<button class="btn btn-edit" onclick="openEditModal(' + JSON.stringify(item) + ')">✏️ 編集</button>' +
              '<button class="btn btn-del"  onclick="openDeleteModal(' + item.rowIndex + ', \'' + escHtml(item.name) + '\')">🗑️ 削除</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  // HTML エスケープ
  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ===== 編集モーダル =====
  function openEditModal(item) {
    document.getElementById('editRowIndex').value    = item.rowIndex;
    document.getElementById('editEmail').value       = item.email || '';
    document.getElementById('editName').value        = item.name;
    document.getElementById('editDepartment').value  = item.department;
    document.getElementById('editPosition').value    = item.position;
    document.getElementById('editDestination').value = item.destination;
    document.getElementById('editTripDate').value    = stringToDateInput(item.date);
    document.getElementById('editDistrict').value    = item.district;
    document.getElementById('editTransportCost').value = item.transportCost;
    document.getElementById('editOtherCost').value     = item.otherCost;
    document.getElementById('editOverlay').classList.add('open');
  }
  function closeEditModal(e) {
    if (e && e.target !== document.getElementById('editOverlay')) return;
    document.getElementById('editOverlay').classList.remove('open');
  }

  document.getElementById('editForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var dateVal = document.getElementById('editTripDate').value;
    var dateStr = dateInputToString(dateVal);
    if (dateStr.length !== 8) {
      showToast('日付を正しく入力してください。', 'error');
      return;
    }
    var rowIndex = Number(document.getElementById('editRowIndex').value);
    var formData = {
      name:          document.getElementById('editName').value.trim(),
      department:    document.getElementById('editDepartment').value.trim(),
      position:      document.getElementById('editPosition').value.trim(),
      destination:   document.getElementById('editDestination').value.trim(),
      date:          dateStr,
      district:      document.getElementById('editDistrict').value,
      transportCost: Number(document.getElementById('editTransportCost').value) || 0,
      otherCost:     Number(document.getElementById('editOtherCost').value)     || 0,
      email:         document.getElementById('editEmail').value
    };
    document.getElementById('editOverlay').classList.remove('open');
    showLoading();
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        if (result && result.success) {
          showToast('更新しました！', 'success');
          loadList();
        } else {
          showToast('更新エラー: ' + (result && result.error ? result.error : '不明'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('通信エラー: ' + err.message, 'error');
      })
      .updateData(rowIndex, formData);
  });

  // ===== 削除モーダル =====
  var _deleteRowIndex = null;
  function openDeleteModal(rowIndex, name) {
    _deleteRowIndex = rowIndex;
    document.getElementById('deleteOverlay').classList.add('open');
  }
  function closeDeleteModal() {
    _deleteRowIndex = null;
    document.getElementById('deleteOverlay').classList.remove('open');
  }
  document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
    if (!_deleteRowIndex) return;
    var idx = _deleteRowIndex;
    closeDeleteModal();
    showLoading();
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        if (result && result.success) {
          showToast('削除しました。', 'success');
          loadList();
        } else {
          showToast('削除エラー: ' + (result && result.error ? result.error : '不明'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('通信エラー: ' + err.message, 'error');
      })
      .deleteData(idx);
  });
</script>
</body>
</html>
